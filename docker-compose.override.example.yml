#  DuomoGrid — docker-compose.override.yml  (TEMPLATE)
#  Attach DuomoGrid to an EXISTING Traefik on an external `proxy` network,
#  optionally behind Authentik forward-auth.
#
#  Docker Compose auto-merges a file named `docker-compose.override.yml` on top
#  of the generic `docker-compose.yml`:
#
#      cp docker-compose.override.example.yml docker-compose.override.yml
#      # edit the host, resolver and middleware below, then:
#      docker compose up -d
#
#  The real `docker-compose.override.yml` is gitignored (it is host-specific).
#  The tracked `docker-compose.yml` stays a generic blueprint; don't edit it.
#
#  What this override changes vs the base compose:
#    • image    → :edge  (rebuilt on every push to main; pin :vX.Y.Z for stable)
#    • ports    → none   (Traefik reaches the container over `proxy`)
#    • network  → external `proxy`
#    • labels   → your Traefik routers (edit host, certresolver, middleware)
#
#  `!reset` / `!override` need Compose >= 2.24.

services:
  api:
    image: ghcr.io/s3ntin3l8/duomogrid:edge       # or :latest / :vX.Y.Z for stable
    ports: !reset []                               # drop host publish; route via Traefik
    networks: [proxy]
    # Other settings (CORS_ORIGIN, DB_ENCRYPTION_KEY, RATE_LIMIT_*, LOG_LEVEL) go
    # in .env. CORS is off by default and the desk is same-origin, so
    # CORS_ORIGIN is only needed if another web origin must call the API.
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.duomogrid.loadbalancer.server.port=3000

      # API routes carry their own auth (Authorization: Bearer $INGEST_TOKEN)
      # and are called by the browser extension and the desk, which cannot
      # follow an SSO redirect, so they bypass forward-auth. The desk's own
      # token paste stays the real gate for these paths.
      - "traefik.http.routers.duomogrid-api.rule=Host(`duomogrid.example.com`) && (PathPrefix(`/listings`) || PathPrefix(`/assumptions`))"
      - traefik.http.routers.duomogrid-api.entrypoints=websecure
      - traefik.http.routers.duomogrid-api.tls.certresolver=le   # your resolver (le / cloudflare / …)
      - traefik.http.routers.duomogrid-api.priority=100
      - traefik.http.routers.duomogrid-api.service=duomogrid

      # The desk (static SPA) and everything else. Uncomment `middlewares` to
      # put it behind your Authentik forward-auth chain (defined in Traefik's
      # dynamic config, e.g. chain-authentik@file).
      - traefik.http.routers.duomogrid.entrypoints=websecure
      - "traefik.http.routers.duomogrid.rule=Host(`duomogrid.example.com`)"
      - traefik.http.routers.duomogrid.tls.certresolver=le
      # - traefik.http.routers.duomogrid.middlewares=chain-authentik@file

networks:
  proxy:
    external: true
