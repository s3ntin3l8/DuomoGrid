name: Compose

# Validates the tracked docker-compose.yml blueprint.
# Deliberately not path-filtered: it is cheap, and an always-reported check can
# be made required without blocking unrelated PRs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate blueprint
        env:
          INGEST_TOKEN: ci-placeholder # pragma: allowlist secret
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
